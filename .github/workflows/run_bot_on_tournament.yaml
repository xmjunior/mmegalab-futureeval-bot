name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Test Bot"]
    branches: [verify/futureeval]
    types: [completed]
  schedule:
    - cron: "11,31,51 * * * *"

permissions:
  contents: read

concurrency:
  group: futureeval-seasonal
  cancel-in-progress: false

jobs:
  forecast_job:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha == github.sha))
    env:
      # Set true only after the required participation form has been submitted.
      FUTUREEVAL_REGISTERED: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Check seasonal questions while participation is pending
        if: env.FUTUREEVAL_REGISTERED != 'true'
        run: uv run --locked --no-dev python main.py --mode seasonal-check
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Forecast on unanswered seasonal FutureEval questions
        if: env.FUTUREEVAL_REGISTERED == 'true'
        run: uv run --locked --no-dev python main.py --mode seasonal
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
