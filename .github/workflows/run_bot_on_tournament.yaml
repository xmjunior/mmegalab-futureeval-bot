name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  push:
    branches: [release/futureeval]
  schedule:
    - cron: "11,31,51 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: futureeval-seasonal
  cancel-in-progress: false

jobs:
  forecast_job:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref_name == 'release/futureeval')
    env:
      # Set true only after the required participation form has been submitted.
      FUTUREEVAL_REGISTERED: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify promoted commit is green and current
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$main_sha"
          verified=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/test_bot.yaml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=success \
            --jq '[.workflow_runs[] | select(.head_branch == "verify/futureeval" or .head_branch == "verify/futureeval-expanded" or .head_branch == "main")] | .[0].head_sha // ""')
          test "$verified" = "$GITHUB_SHA"
          echo "Promoted tested main commit $main_sha"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Check seasonal questions while participation is pending
        if: env.FUTUREEVAL_REGISTERED != 'true'
        run: uv run --locked --no-dev python main.py --mode seasonal-check
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Forecast on unanswered seasonal FutureEval questions
        if: env.FUTUREEVAL_REGISTERED == 'true'
        run: uv run --locked --no-dev python main.py --mode seasonal
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
