name: OMEGA Market Pulse closed numerical review
on:
  push:
    branches: [research/omega-infinity]
    paths: [research/omega/market_review/cases.json]
permissions:
  contents: read
concurrency:
  group: omega-market-closed-numeric-review
  cancel-in-progress: false
jobs:
  groq:
    if: github.repository == 'xmjunior/mmegalab-futureeval-bot' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cc13bf9f9979a745e4e28ec1376c40df26187202
          path: groq-transport
          persist-credentials: false
      - name: Verify original prompts and offline tests
        working-directory: research/omega/market_review
        run: |
          python -m pip install --disable-pip-version-check requests==2.34.2
          python -m unittest discover -v
          python review.py offline
      - name: Review three closed numeric decisions on the verified Free account
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_ACCOUNT_CONFIRMED: "true"
          PYTHONPATH: ${{ github.workspace }}/groq-transport
        shell: bash
        run: python research/omega/market_review/review.py groq | tee market-review-receipt.json
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('market-review-receipt.json') != ''
        with:
          name: historical-market-review
          path: market-review-receipt.json
          retention-days: 90
