name: Market Pulse 26Q4 validation
on:
  push:
    branches: [verify/market-pulse-26q4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-pulse-validation
  cancel-in-progress: false
jobs:
  historical-and-dry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked --no-dev
      - name: Score resolved questions and rehearse a numeric group without publishing
        run: uv run --locked --no-dev python market_pulse.py validate
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALLOW_CPU_FALLBACK: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: market-pulse-validation
          path: market-proof.json
          retention-days: 60
          if-no-files-found: error
