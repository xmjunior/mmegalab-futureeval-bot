name: Confirm Groq free allocation
on:
  push:
    branches: [verify/openai-access-audit]
    paths: ['.github/workflows/groq_free_eligibility.yaml']
permissions: {contents: read}
jobs:
  entitlement:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 9e3cecf3189ffcc70e3b3f9b6db1137b4a09ac6f, persist-credentials: false}
      - name: Read billing-tier evidence without inference or creating a batch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python research/promo/groq_trial.py --entitlement-only
