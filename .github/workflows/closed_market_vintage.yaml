name: Replay resolved Market Pulse vintages via FRED
on:
  push:
    branches: [verify/openai-access-audit]
    paths: ['.github/workflows/closed_market_vintage.yaml']
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 0cede7564325469e4b00ae72ab97d2cb5b297356, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: f2a09239ee817f82d794f625b19dcc792e2068af, path: frozen-market, persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical library from PyPI
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 --disable-pip-version-check
      - name: Compare original distributions with ALFRED releases available before each cutoff
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/market_vintage_check.py frozen-market --fallback-smoke
