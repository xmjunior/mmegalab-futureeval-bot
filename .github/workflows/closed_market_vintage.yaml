name: Replay resolved Market Pulse vintages via FRED
on:
  push:
    branches: [verify/openai-access-audit]
    paths: ['.github/workflows/closed_market_vintage.yaml']
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 8df3c813c80cc5931a00816cf6835dac5c91b7c7, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 5ba764b6bafa61fcaef03022a4ff36835401d4ac, path: frozen-market, persist-credentials: false}
      - name: Install numerical library from PyPI
        run: python -m pip install --only-binary=:all: numpy==2.2.6 --disable-pip-version-check
      - name: Compare original distributions with ALFRED releases available before each cutoff
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/market_vintage_check.py frozen-market
