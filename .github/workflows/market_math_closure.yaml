name: Market Pulse offline math regressions
on:
  push:
    branches: [research/market-math-closure]
permissions:
  contents: read
jobs:
  market-math:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
      - run: uv sync --locked --no-dev
      - name: Run only Market Pulse mathematical regressions
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: .venv/bin/python -m unittest discover -s tests -p test_market_math.py -v
