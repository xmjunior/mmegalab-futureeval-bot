name: Test Bot

on:
  workflow_dispatch:
    inputs:
      test_size:
        description: Number of unpublished testing-area forecasts
        type: choice
        options: ["1", "2", "5", "10"]
        default: "1"
  push:
    branches: [verify/futureeval, verify/futureeval-expanded]

permissions:
  contents: read

concurrency:
  group: futureeval-test
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checkout matches the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$main_sha"
          echo "Verified main commit $main_sha"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Run bot
        run: uv run --locked --no-dev python main.py --mode test_questions --test-size "$TEST_SIZE"
        env:
          TEST_SIZE: ${{ inputs.test_size || (github.ref_name == 'verify/futureeval-expanded' && '10') || '1' }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_ACCOUNT_CONFIRMED: "true"
