name: Verify repository OpenAI access without inference
on:
  push:
    branches: [verify/openai-access-audit]

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/verify/openai-access-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify exact run and check secret names
        id: names
        env:
          REPO_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY != '' }}
          HAS_ADMIN_API_KEY: ${{ secrets.OPENAI_ADMIN_API_KEY != '' }}
          HAS_USAGE_KEY: ${{ secrets.OPENAI_USAGE_API_KEY != '' }}
          HAS_PROJECT_SECRET: ${{ secrets.OPENAI_PROJECT_ID != '' || secrets.OPENAI_PROJECT != '' }}
          HAS_PROJECT_VAR: ${{ vars.OPENAI_PROJECT_ID != '' || vars.OPENAI_PROJECT != '' }}
        run: |
          python - <<'PY'
          import http.client, json, os
          e = os.environ
          repo = "xmjunior/mmegalab-futureeval-bot"
          if e["GITHUB_REPOSITORY"] != repo or e["GITHUB_REF"] != "refs/heads/verify/openai-access-audit":
              raise SystemExit("Unexpected repository or branch")
          def read_github(path):
              conn = http.client.HTTPSConnection("api.github.com", timeout=12)
              conn.request("GET", "/repos/" + repo + "/" + path, headers={
                  "Authorization": "Bearer " + e["REPO_TOKEN"], "User-Agent": "repository-access-audit",
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              reply = conn.getresponse()
              data = reply.read()
              status = reply.status
              conn.close()
              return status, json.loads(data) if status == 200 else {}
          status, ref = read_github("git/ref/heads/verify/openai-access-audit")
          if status != 200 or ref["object"]["sha"] != e["GITHUB_SHA"]:
              raise SystemExit("Unverified run commit")
          print("Verified repository commit", e["GITHUB_SHA"])
          names = {"OPENAI_API_KEY", "OPENAI_ADMIN_KEY", "OPENAI_ADMIN_API_KEY", "OPENAI_USAGE_API_KEY",
                   "OPENAI_PROJECT_ID", "OPENAI_PROJECT"}
          for path in ("actions/secrets", "actions/organization-secrets"):
              status, listed = read_github(path + "?per_page=100")
              found = sorted(item["name"] for item in listed.get("secrets", []) if item["name"] in names)
              print("GitHub metadata", path, "http=" + str(status), "matching_names=" + (",".join(found) or "none-visible"))
          status, environments = read_github("environments?per_page=100")
          print("GitHub environments metadata http=" + str(status), "count=" + str(environments.get("total_count", "unknown")))
          for field in ("HAS_KEY", "HAS_ADMIN_KEY", "HAS_ADMIN_API_KEY", "HAS_USAGE_KEY", "HAS_PROJECT_SECRET", "HAS_PROJECT_VAR"):
              print("Workflow context", field, e[field])
          print("Inference requests=0")
          if e["HAS_KEY"] != "true":
              print("OpenAI models GET skipped: repository workflow has no OPENAI_API_KEY")
          with open(e["GITHUB_OUTPUT"], "a") as result:
              print("has_key=" + e["HAS_KEY"], file=result)
          PY
      - name: Check API authentication with one model-list GET
        if: steps.names.outputs.has_key == 'true'
        env:
          USER_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONFIGURED_PROJECT: ${{ vars.OPENAI_PROJECT_ID || vars.OPENAI_PROJECT || secrets.OPENAI_PROJECT_ID || secrets.OPENAI_PROJECT }}
        run: |
          python - <<'PY'
          import hashlib, http.client, json, os, re
          project = os.environ.get("CONFIGURED_PROJECT", "")
          def project_ref(value):
              if not re.fullmatch(r"proj_[A-Za-z0-9_-]{5,96}", value):
                  return "unidentified"
              return "sha256-" + hashlib.sha256(value.encode()).hexdigest()[:12]
          headers = {"Authorization": "Bearer " + os.environ["USER_OPENAI_KEY"],
                     "User-Agent": "repository-access-audit"}
          if project:
              if project_ref(project) == "unidentified":
                  raise SystemExit("Configured project identifier is malformed")
              headers["OpenAI-Project"] = project
          conn = http.client.HTTPSConnection("api.openai.com", timeout=15)
          conn.request("GET", "/v1/models", headers=headers)
          reply = conn.getresponse()
          status = reply.status
          observed_project = reply.getheader("openai-project", "")
          payload = reply.read()
          conn.close()
          print("OpenAI GET /v1/models http=" + str(status), "inference_requests=0")
          if status != 200:
              raise SystemExit("Credential did not authorize model list")
          models = {m["id"] for m in json.loads(payload)["data"]}
          published = {"gpt-4.1", "gpt-4.1-mini", "gpt-5", "gpt-5-mini", "gpt-5-nano",
                       "gpt-5.2", "gpt-5.4", "gpt-5.4-mini", "gpt-5.5", "o3", "o4-mini"}
          print("Accessible model count", len(models), "matched_public_ids", ",".join(sorted(models & published)))
          print("Project selector verified", project_ref(project) if project else "no selector",
                "response project", project_ref(observed_project))
          PY
