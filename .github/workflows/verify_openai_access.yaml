name: Verify provider access and frozen independent Treasury source
on:
  push:
    branches: [verify/openai-access-audit]
    paths: ['research/resource_access.py', '.github/workflows/verify_openai_access.yaml']
permissions:
  contents: read
concurrency:
  group: research-provider-credentials
  cancel-in-progress: false
jobs:
  credentials:
    if: github.repository == 'xmjunior/mmegalab-futureeval-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: OpenAI model-list access only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.MEGALAB_OPENAI_API_KEY || secrets.OPENAI_PROJECT_API_KEY || secrets.OPENAI_API_KEY_MEGALAB }}
        run: python research/resource_access.py openai
      - name: AskNews rate limits without using tokens
        if: "!cancelled()"
        env:
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
        run: python research/resource_access.py asknews
  tavily:
    if: github.repository == 'xmjunior/mmegalab-futureeval-bot'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check quota and retrieve one preregistered official source
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || secrets.MEGALAB }}
          TAVILY_SOURCE: ${{ secrets.TAVILY_API_KEY != '' && 'TAVILY_API_KEY' || 'MEGALAB' }}
          GH_TOKEN: ${{ github.token }}
        run: python research/resource_access.py tavily --search
