name: Verify configured alternative provider names
on:
  push:
    branches: [verify/openai-access-audit]

permissions: {}

jobs:
  presence:
    if: github.repository == 'xmjunior/mmegalab-futureeval-bot' && github.ref == 'refs/heads/verify/openai-access-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate allowed secret names without exposing values
        env:
          HAS_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
          HAS_CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY != '' }}
          HAS_HF_TOKEN: ${{ secrets.HF_TOKEN != '' }}
          HAS_HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY != '' }}
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY != '' }}
        run: |
          python - <<'PY'
          import os
          names = (
              "GROQ_API_KEY", "CEREBRAS_API_KEY", "HF_TOKEN", "HUGGINGFACE_API_KEY",
              "CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "MISTRAL_API_KEY",
          )
          for name in names:
              status = os.environ["HAS_" + name]
              if status not in ("true", "false"):
                  raise SystemExit("Unexpected presence flag")
              print(f"Configured {name}={status}")
          PY
