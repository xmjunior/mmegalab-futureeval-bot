name: Seal the independent Groq Treasury panel
on:
  push:
    branches: [verify/arena-groq-treasury]
permissions:
  contents: read
concurrency:
  group: champion-promo-single-panel
  cancel-in-progress: false
jobs:
  seal:
    if: github.repository == 'xmjunior/mmegalab-futureeval-bot' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Issue the pre-registered Groq arm before its existing deadline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/promo/groq_trial.py --owner-free-until '2026-11-24T23:59:59+00:00'
