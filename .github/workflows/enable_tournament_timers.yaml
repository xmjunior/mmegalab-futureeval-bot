name: Confirm tournament timers enabled
on:
  push:
    branches: [ops/enable-tournament-timers]
permissions:
  contents: read
  actions: write
jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reaffirm native GitHub schedules without disabling or dispatching
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for file in run_bot_on_tournament.yaml run_bot_on_minibench.yaml; do
            url="repos/$GITHUB_REPOSITORY/actions/workflows/$file"
            echo "$file before=$(gh api "$url" --jq .state)"
            gh api --method PUT "$url/enable"
            echo "$file after=$(gh api "$url" --jq .state)"
          done
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=schedule -f per_page=1 --jq '.total_count'
