name: Recover seasonal window after official hosted test
on:
  push:
    branches: [ops/recover-seasonal-on-provider]
permissions:
  actions: write
  contents: read
concurrency:
  group: seasonal-signal-recovery-20261124
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify hosted test on current main and the unanswered seasonal window
        run: |
          python -u - <<'PYCODE'
          from research.recover_window import GH, request, seasonal, stamp
          current = request(GH, "/commits/main")["sha"]
          run = request(GH, "/actions/runs/45475106633")
          if not "2026-11-24T19:55" <= stamp() < "2026-11-24T20:10":
              raise SystemExit("The recovery signal expired")
          if not (run["conclusion"] == "success" and run["head_sha"] == current and
                  run["path"] == ".github/workflows/test_bot.yaml"):
              raise ValueError("Official test at current production SHA is missing")
          seasonal(recent_since="2026-11-24T19:50:00Z", allow_research_control=True)
          PYCODE
        env:
          GH_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
