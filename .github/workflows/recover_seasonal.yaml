name: Recover an unanswered seasonal opportunity
on:
  push:
    branches: [ops/recover-seasonal-on-provider]
permissions:
  contents: read
  actions: write
concurrency:
  group: champion-tournament-watchdog
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check open timestamps and authoritative own history, then dispatch once
        env:
          GH_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,datetime,time
          def fetch(url,token,prefix):
              req=urllib.request.Request(url,headers={"Authorization":prefix+token,"User-Agent":"forecast-operations"})
              with urllib.request.urlopen(req,timeout=25) as r: return json.load(r)
          gh="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/workflows/run_bot_on_tournament.yaml"
          meta="https://www.metaculus.com/api"
          gt=os.environ["GH_TOKEN"]; mt=os.environ["METACULUS_TOKEN"]
          repo="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]
          expected="8d52a632256a34d87df28e9124769fb14e69db55"
          if fetch(repo+"/commits/main",gt,"Bearer ")["sha"]!=expected:
              print("Verified main SHA changed; skip."); raise SystemExit(0)
          test=fetch(repo+"/actions/runs/45467213084",gt,"Bearer ")
          if test["conclusion"]!="success": raise ValueError("Live testing-area transport was not verified")
          runs=fetch(gh+"/runs?per_page=10",gt,"Bearer ")["workflow_runs"]
          if any(r["status"]!="completed" or r["created_at"]>="2026-11-24T19:03:00Z" for r in runs):
              print("A newer seasonal attempt already exists; skip."); raise SystemExit(0)
          me=fetch(meta+"/users/me",mt,"Token ")
          if me["id"]!=313890 or me["is_primary_bot"] is not True: raise ValueError("Wrong primary bot")
          time.sleep(4)
          history=fetch(meta+"/questions/bulk-forecast-read/?project=33121",mt,"Token ")["results"]
          matches=[x for x in history if x["question_id"]==46894]
          if len(matches)!=1: raise ValueError("Unverified question membership or history")
          if matches[0]["forecasts"]: print("An own submission already exists; skip."); raise SystemExit(0)
          time.sleep(4)
          q=fetch(meta+"/questions/46894/",mt,"Token ")
          now=datetime.datetime.now(datetime.timezone.utc)
          is_open=(q["id"]==46894 and q["status"]=="open" and now<datetime.datetime.fromisoformat(q["scheduled_close_time"]))
          print("Question=46894 open=",is_open,"own_forecasts=0")
          if not is_open: raise SystemExit(0)
          req=urllib.request.Request(gh+"/dispatches",method="POST",data=b'{"ref":"main"}',
              headers={"Authorization":"Bearer "+gt,"User-Agent":"forecast-operations","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=25) as r: print("Seasonal workflow dispatch HTTP",r.status)
          PY
