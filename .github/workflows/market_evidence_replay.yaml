name: Replay sealed Market Pulse reviewer decisions offline
on:
  push:
    branches: [verify/omega-market-candidate]
    paths:
      - research/market_evidence_v2/results/comparison.json
      - .github/workflows/market_evidence_replay.yaml
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: ${{ github.workspace }}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked --no-dev
      - name: Score the existing artifact without network or inference
        run: |
          .venv/bin/python - <<'PY'
          import json, os, sys, socket
          from pathlib import Path
          def block_network(event, args):
              if event == "socket.connect" and args[0].family in (socket.AF_INET, socket.AF_INET6):
                  raise PermissionError("Offline replay")
          sys.addaudithook(block_network)
          folder=Path("research/market_evidence_v2")
          sys.path.insert(0,str(folder.resolve()))
          from trial import load_inputs,score
          folder=folder/"results"
          def read(name):
              return json.loads((folder/name).read_bytes())
          computed=score(load_inputs(),read("receipts.json"),read("labels.json"))
          assert computed==read("comparison.json")
          print(json.dumps(computed,sort_keys=True))
          PY
