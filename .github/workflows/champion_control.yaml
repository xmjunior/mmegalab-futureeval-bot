name: Champion research and competition control
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'recovery' && format('Champion recovery cycle {0} errors {1}', inputs.recovery_cycle, inputs.recovery_errors) || github.event_name == 'workflow_dispatch' && format('Champion {0}', inputs.mode || 'control') || github.event_name == 'schedule' && format('Champion schedule {0}', github.event.schedule) || github.workflow }}
on:
  schedule:
    - cron: "17 7,19 * * *"
    - cron: "27 * * * *"
  workflow_run:
    workflows: ["Forecast on new AI tournament questions", "Forecast on MiniBench", "Market Pulse 26Q4 spot updates"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Control, inspect the recovery environment, or start its bounded clock
        type: choice
        options: [control, recovery_check, recovery]
        default: control
      recovery_cycle:
        type: string
        default: '0'
      recovery_errors:
        type: string
        default: '0'
  push:
    branches: [verify/champion-v2-control]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'champion-recovery-seeds' || github.event_name == 'workflow_dispatch' && inputs.mode == 'recovery' && 'champion-recovery-clock' || github.event_name == 'workflow_dispatch' && inputs.mode == 'recovery_check' && 'champion-recovery-inspection' || 'champion-v2-observations' }}
  cancel-in-progress: false
env:
  ARENA_SHA: "b7ae51518d9ea78add74cd6b02ba9685576efbb2"
  RECOVERY_SHA: "8b6e3f028991fe112e2aae1998afb0f1656dcc7c"
  RECOVERY_MODE: ${{ inputs.mode }}
  RECOVERY_CYCLE: ${{ inputs.recovery_cycle || '0' }}
  RECOVERY_ERRORS: ${{ inputs.recovery_errors || '0' }}
  RESEARCH_SHA: "9e3cecf3189ffcc70e3b3f9b6db1137b4a09ac6f"
jobs:
  evaluate:
    if: (github.event_name != 'workflow_dispatch' || !startsWith(inputs.mode, 'recovery')) && (github.ref_name == 'main' || (github.event_name == 'push' && github.ref_name == 'verify/champion-v2-control')) && github.event_name != 'workflow_run' && (github.event_name != 'schedule' || github.event.schedule == '17 7,19 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_SHA }}
          persist-credentials: false
      - name: Verify the frozen code revision
        run: test "$(git rev-parse HEAD)" = "$RESEARCH_SHA"
      - uses: actions/checkout@v4
        with:
          ref: research/champion-observations
          path: previous
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: research/openai-promo-ledger-v2
          path: provider-panel
          persist-credentials: false
      - name: Restore the committed observations
        run: |
          set -eu
          mkdir -p state
          cp previous/records/treasury.json state/treasury.json
          if test -f previous/records/minibench.json; then cp previous/records/minibench.json state/; fi
          if test -f previous/records/promo-score.json; then cp previous/records/promo-score.json state/; fi
      - name: Score the sealed public Treasury panel after official observations mature
        id: promo
        continue-on-error: true
        run: python research/promo/settle.py --state state/promo-score.json --journal provider-panel/promo-ledger.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ARENA_SHA }}
          path: arena-code
          persist-credentials: false
      - name: Score the independent sealed ARENA panel
        id: arena
        if: steps.promo.outcome == 'success'
        continue-on-error: true
        run: |
          set -eu
          test "$(git -C arena-code rev-parse HEAD)" = "$ARENA_SHA"
          python arena-code/research/arena/arena.py score state/promo-score.json > state/arena.tmp
          mv state/arena.tmp state/arena.json
      - name: Check configured zero-cost provider capabilities without inference
        run: |
          python research/provider_status.py
          mv provider-status.json state/
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || secrets.MEGALAB }}
          HAS_OPENAI_PROJECT_KEY: ${{ secrets.OPENAI_API_KEY != '' || secrets.MEGALAB_OPENAI_API_KEY != '' || secrets.OPENAI_PROJECT_API_KEY != '' || secrets.OPENAI_API_KEY_MEGALAB != '' }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Forecast and settle only the independent Treasury benchmark
        id: treasury
        continue-on-error: true
        run: python research/shadow.py --ledger state/treasury.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Evaluate the frozen MiniBench challenger on resolved own forecasts
        id: minibench
        continue-on-error: true
        run: python research/minibench_eval.py --ledger state/minibench.json
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Audit tournament participation independently of forecast generation
        id: audit
        continue-on-error: true
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          python research/participation.py
      - name: Stage the audit and record actual step outcomes
        env:
          PROMO: ${{ steps.promo.outcome }}
          ARENA: ${{ steps.arena.outcome }}
          TREASURY: ${{ steps.treasury.outcome }}
          MINI: ${{ steps.minibench.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          if test -f participation-audit.json; then cp participation-audit.json state/participation.json; fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          keys = ['TREASURY','MINI','AUDIT','PROMO','ARENA','ARENA_SHA','RESEARCH_SHA','GITHUB_SHA','GITHUB_EVENT_NAME','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']
          info = {k:os.environ[k] for k in keys}
          Path('state/run.json').write_text(json.dumps(info, indent=2)+'\n')
          print(json.dumps(info))
          PY
          python research/control_report.py state > state/control.md
      - uses: actions/upload-artifact@v4
        with:
          name: champion-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/*.json
            state/control.md
          retention-days: 3
          if-no-files-found: error
  record:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/champion-observations
      - uses: actions/download-artifact@v4
        with:
          name: champion-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming
      - name: Commit the ledger and dated audit to its own branch
        run: |
          set -eu
          test "$(git branch --show-current)" = research/champion-observations
          python - <<'PY'
          import json,os
          from pathlib import Path
          from shutil import copyfile
          src=Path('incoming')
          dest=Path('records')
          run=json.loads((src/'run.json').read_text())
          assert run['GITHUB_RUN_ID'] == os.environ['GITHUB_RUN_ID']
          snapshot=dest/'runs'/(run['GITHUB_RUN_ID']+'-'+run['GITHUB_RUN_ATTEMPT'])
          snapshot.mkdir(parents=True,exist_ok=True)
          for name,status in [('treasury.json','TREASURY'),('minibench.json','MINI'),('promo-score.json','PROMO'),('arena.json','ARENA')]:
              f=src/name
              if f.exists() and run[status]=='success':
                  json.loads(f.read_text())
                  copyfile(f,dest/name)
          for name in ['participation.json','provider-status.json','promo-score.json','arena.json','run.json']:
              f=src/name
              if f.is_file():
                  json.loads(f.read_text())
                  copyfile(f,snapshot/name)
          if (src/'control.md').is_file():
              copyfile(src/'control.md',snapshot/'control.md')
              copyfile(src/'control.md',dest/'control.md')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- records/
          if ! git diff --cached --quiet; then
            git commit -m "Record autonomous forecast checks for run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            git push origin HEAD:refs/heads/research/champion-observations
          fi
      - name: Require all collectors and scores to have completed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('incoming/run.json').read_text())
          incomplete=[field for field in ('TREASURY','MINI','AUDIT','PROMO','ARENA') if run[field]!='success']
          if incomplete: raise SystemExit('Incomplete checks: '+', '.join(incomplete))
          PY
  coverage:
    if: (github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'Market Pulse 26Q4 spot updates' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))) && (github.event_name != 'workflow_dispatch' || !startsWith(inputs.mode, 'recovery')) && (github.ref_name == 'main' || (github.event_name == 'push' && github.ref_name == 'verify/champion-v2-control'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RESEARCH_SHA }}
          persist-credentials: false
      - name: Recover a missed polling window only if it contains an unanswered question
        env:
          GH_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ENABLED: ${{ github.ref_name == 'main' }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            python research/watchdog.py --dispatch
          else
            python research/watchdog.py
          fi
  recovery-preflight:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions: {contents: read, actions: read}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      checked_epoch: ${{ steps.check.outputs.checked_epoch }}
      environment_id: ${{ steps.check.outputs.environment_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_SHA }}
          persist-credentials: false
      - id: check
        name: Check existing protected environment before referencing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RECOVERY_SHA"
          python research/recovery_clock.py preflight
  recovery-backoff:
    if: needs.recovery-preflight.outputs.ready == 'true' && inputs.recovery_errors != '0'
    needs: recovery-preflight
    environment: forecast-recovery
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    timeout-minutes: 60
    outputs:
      checked_epoch: ${{ steps.verify.outputs.checked_epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_SHA }}
          persist-credentials: false
      - id: verify
        timeout-minutes: 3
        name: Verify the first server-side wait before starting the second
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_ENV_ID: ${{ needs.recovery-preflight.outputs.environment_id }}
          CHECKED_EPOCH: ${{ needs.recovery-preflight.outputs.checked_epoch }}
        run: |
          test "$(git rev-parse HEAD)" = "$RECOVERY_SHA"
          python research/recovery_clock.py backoff
  recovery-wake:
    needs: [recovery-preflight, recovery-backoff]
    if: ${{ !cancelled() && needs.recovery-preflight.outputs.ready == 'true' && (needs.recovery-backoff.result == 'success' || (needs.recovery-backoff.result == 'skipped' && inputs.recovery_errors == '0')) }}
    environment: forecast-recovery
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: write}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_SHA }}
          persist-credentials: false
      - name: Verify elapsed wait and recover missing tournament polls
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          CHECKED_ENV_ID: ${{ needs.recovery-preflight.outputs.environment_id }}
          CHECKED_EPOCH: ${{ needs.recovery-backoff.outputs.checked_epoch || needs.recovery-preflight.outputs.checked_epoch }}
        run: |
          test "$(git rev-parse HEAD)" = "$RECOVERY_SHA"
          python research/recovery_clock.py wake
  recovery-seed:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' && github.event.action == 'completed' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: write}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RECOVERY_SHA }}
          persist-credentials: false
      - name: Seed recovery only from a trusted original workflow completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RECOVERY_SHA"
          python research/recovery_clock.py seed
  omega-forward:
    if: (github.event_name != 'workflow_dispatch' || !startsWith(inputs.mode, 'recovery')) && (github.ref_name == 'main' || (github.event_name == 'push' && github.ref_name == 'verify/champion-v2-control')) && github.event_name != 'workflow_run' && (github.event_name != 'schedule' || github.event.schedule == '17 7,19 * * *')
    permissions:
      contents: write
    concurrency:
      group: omega-independent-weekly-spread
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e8f54568515ca9bae7bac892ea99a81d5d26ead9
          path: science
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: cc13bf9f9979a745e4e28ec1376c40df26187202
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: research/omega-forward-ledger
          path: omega-records
      - name: Test leases, clocks and immutable paired scoring
        run: |
          python -m unittest discover -s science/research/omega/forward -v
          python -m pip install --disable-pip-version-check requests==2.34.2
      - name: Issue or settle only the independent weekly spread experiment
        env:
          PYTHONPATH: ${{ github.workspace }}/transport
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_ACCOUNT_CONFIRMED: "true"
        run: python science/research/omega/forward/live.py omega-records
  omega-settlement:
    needs: evaluate
    if: ${{ !cancelled() && (needs.evaluate.result == 'success' || needs.evaluate.result == 'failure') }}
    permissions:
      contents: write
    uses: ./.github/workflows/omega_settlement.yaml
  recovery-bundle:
    needs: [record, omega-forward, omega-settlement]
    if: ${{ !cancelled() && (needs.record.result == 'success' || needs.record.result == 'failure') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore a fresh mirror and verify all branch and tag identities
        run: bash tools/recovery_bundle.sh "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" recovery
      - uses: actions/upload-artifact@v4
        with:
          name: megalab-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery/
          retention-days: 14
          if-no-files-found: error
